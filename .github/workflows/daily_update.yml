name: Daily Update

on:
  # 10:23 UTC = 3:23 AM Arizona time (UTC-7, fixed - the same real
  # convention schedule.today_local() already uses for "today," and the
  # user's own real timezone) - moved from the old "0 12 * * *" (noon
  # UTC = 5 AM AZ) after a real report that the site still wasn't
  # updated by 10 AM AZ with games about to start. Two real, separate
  # reasons this earlier slot is more reliable, not just "earlier":
  # 1. More real buffer before the earliest MLB games (as early as
  #    ~9 AM AZ for a 12:05 PM ET getaway-day game) - roughly 5.5-6
  #    hours of lead time instead of ~4.
  # 2. Off the top of the hour (`:23`, not `:00`) - GitHub's own docs
  #    warn that scheduled workflows "can be delayed during periods of
  #    high load," and the top of the hour (and especially popular
  #    round-UTC times like noon) is exactly when that load peaks
  #    across every public repo's own default-choice cron schedules.
  # No DST drift to worry about here, unlike most US timezones - real
  # Arizona time is fixed UTC-7 year-round (see schedule.today_local's
  # own docstring), so this offset never needs revisiting.
  # Doesn't fix a separate, already-known issue: re-running this
  # workflow again LATER on a date it already ran for won't refresh
  # that date's still-pending picks (append_game_predictions keeps the
  # existing logged row over a freshly-recomputed one) - only a fresh
  # calendar date benefits from this earlier schedule automatically.
  # Fixed: append_game_predictions now refreshes unresolved same-day
  # rows; the Lineup Lock Update workflow handles confirmed-lineup
  # refreshes separately. Morning Daily Update remains the preliminary
  # snapshot (prediction_snapshot_type=morning).
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Create output folders
        run: |
          mkdir -p docs/data
          mkdir -p data/raw
          mkdir -p data/predictions

      - name: Run model
        run: |
          python scripts/wave.py

      - name: Build DFS rankings
        run: |
          python scripts/build_dfs_rankings.py

      - name: Build hit streaks
        run: |
          python scripts/build_hit_streaks.py

      - name: Build hitter hit predictions
        run: |
          python scripts/build_hitter_hit_predictions.py

      - name: Build hitter hit log
        run: |
          python scripts/build_hitter_hit_log.py --days 10

      - name: Build optimal lineup
        run: |
          python scripts/build_optimal_lineup.py --objective value

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/ data/raw/ data/predictions/

          git commit -m "Daily update" || echo "No changes"

          # Retry with a rebase before each attempt - same real push-race
          # fix as ml_training_update.yml's own "Commit updates" step
          # (confirmed twice in practice there, on a feature branch
          # receiving concurrent code pushes - this runs on main, which
          # can just as easily receive a concurrent PR merge).
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed - pulling/rebasing and retrying..."
            git pull --rebase origin "$branch"
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
