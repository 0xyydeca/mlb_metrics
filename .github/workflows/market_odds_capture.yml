name: Market Odds Capture

# Capture ESPN/DraftKings moneylines every 30 minutes during the useful MLB
# window, independent of lineup-lock content changes. Lineup-lock exits early
# when lineups are unchanged; this job still persists odds snapshots so
# closing / near-first-pitch prices are available for validation.
#
# Snapshots use role ``intraday`` (never relabeled as morning). Post-start
# captures are classified as ``post_start``. Ambiguous doubleheaders are
# rejected by the safe matcher.

on:
  schedule:
    # Every 30 minutes from 15:00–02:00 UTC (~8am–7pm AZ / covers most
    # first-pitch windows). Offset from lineup-lock (:07/:37) to spread load.
    - cron: "17,47 15-23 * * *"
    - cron: "17,47 0-2 * * *"
  workflow_dispatch:

jobs:
  market-odds-capture:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create output folders
        run: |
          mkdir -p data/predictions

      - name: Capture market odds snapshots
        run: |
          python scripts/capture_market_odds.py

      - name: Commit snapshot / event-map files only
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/predictions/market_odds_snapshots.csv \
                  data/predictions/market_odds_event_map.csv

          git commit -m "Market odds capture" || echo "No changes"

          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed - pulling/rebasing and retrying..."
            git pull --rebase origin "$branch"
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
